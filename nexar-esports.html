<style>

.bd i{display:block;font-style:normal;font-size:24px}.bd span{font-size:9.5px;color:var(--mu);font-weight:700}
.state{text-align:center;padding:36px 12px;color:var(--mu)}.state i{display:block;font-style:normal;font-size:38px;margin-bottom:8px}.state.err{color:var(--red)}
.sk{height:84px;border-radius:13px;margin-bottom:11px;background:linear-gradient(90deg,var(--p) 25%,var(--p2) 50%,var(--p) 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}

#toast.on{opacity:1;transform:translateX(-50%)}#toast.err{border-color:var(--red)}#toast.ok{border-color:var(--grn)}

.room{background:rgba(53,196,106,.08);border:1px solid var(--grn);border-radius:10px;padding:10px;margin-top:8px;font-size:13px}

<script>
(function (root) {
'use strict';
const ADMIN_ID = '7951717415', KEY = 'nexar_local_v1';
class E extends Error { constructor(c, m) { super(m); this.code = c; } }
const bad = (m) => new E(400, m);
const BADGES = [[1,'CHAMPION','CHAMPION',"Turnir g'olibi",'🏆'],[2,'ELITE','ELITE',"Elite darajadagi o'yinchi",'⚡'],[3,'MVP','MVP',"Eng yaxshi o'yinchi",'🔥'],[4,'SNIPER','SNIPER',"Aniqligi yuqori o'yinchi",'🎯'],[5,'VETERAN','VETERAN',"Ko'p turnirlarda qatnashgan",'🛡️'],[6,'LEGEND','LEGEND','Maxsus yuqori daraja','💎'],[7,'TOP','TOP PLAYER',"Reytingdagi kuchli o'yinchi",'👑'],[8,'RISING','RISING STAR',"Tez rivojlanayotgan o'yinchi",'🚀']]
  .map(([id, code, name, description, icon]) => ({ id, code, name, description, icon }));
const TYPES = ['TDM', 'LIVIK', 'ERANGEL', 'BOSHQA'], STATUSES = ['DRAFT', 'OPEN', 'LIVE', 'FINISHED'];
let S;
function load() { try { S = JSON.parse(root.localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !S.users) S = { users: {}, tournaments: [], participants: [], applications: [], matches: [], brackets: {}, userBadges: [], results: [], notifications: [], seq: 1 }; }
const save = () => root.localStorage.setItem(KEY, JSON.stringify(S));
const nid = () => S.seq++;
const now = () => Date.now();

const getUser = (id) => S.users[String(id)];
const pubU = (u) => u && ({ telegram_id: u.telegram_id, username: u.username, first_name: u.first_name, nickname: u.nickname, pubg_id: u.pubg_id, photo_url: u.photo_url, wins: u.wins, losses: u.losses });
const getT = (id) => { const t = S.tournaments.find((x) => x.id === Number(id)); if (!t) throw new E(404, 'Turnir topilmadi.'); return t; };
const badgesOf = (id) => S.userBadges.filter((x) => x.user_id === String(id)).map((x) => BADGES.find((b) => b.id === x.badge_id)).sort((a, b) => a.id - b.id);
const roundName = (r, rounds) => { const rem = rounds - r; return rem === 0 ? 'FINAL' : rem === 1 ? 'YARIM FINAL' : rem === 2 ? 'CHORAK FINAL' : `1/${2 ** rem} FINAL`; };
const str = (v, min, max, label) => { const s = String(v == null ? '' : v).trim(); if (s.length < min || s.length > max || /[\p{C}<>]/u.test(s)) throw bad(`${label} noto'g'ri (${min}-${max} belgi).`); return s; };
function notify(uid, type) { S.notifications.push({ id: nid(), user_id: String(uid), type, status: 'skipped', error: 'Bot yo\'q (bitta faylli versiya)', created_at: now() }); if (S.notifications.length > 200) S.notifications.shift(); }
function profileOf(id) {
  const u = getUser(id); if (!u) throw new E(404, "O'yinchi topilmadi.");
  const mine = S.participants.filter((p) => p.user_id === u.telegram_id && p.status === 'approved');
  const history = mine.map((p) => { const t = S.tournaments.find((x) => x.id === p.tournament_id); const r = S.results.find((x) => x.tournament_id === t.id && x.user_id === u.telegram_id); return { id: t.id, name: t.name, type: t.type, status: t.status, placement: r ? r.placement : null, created_at: t.created_at }; })
    .filter((h) => h.status !== 'DRAFT').sort((a, b) => b.created_at - a.created_at).slice(0, 30);
  return { ...pubU(u), badges: badgesOf(id), tournaments: mine.length, history };
}
const findM = (tid, round, pos) => S.matches.find((m) => m.tournament_id === tid && m.round === round && m.position === pos);
function advance(m) {
  const br = S.brackets[m.tournament_id]; if (!br || m.round >= br.rounds) return null;
  const nx = findM(m.tournament_id, m.round + 1, Math.ceil(m.position / 2));
  nx[m.position % 2 === 1 ? 'player1_id' : 'player2_id'] = m.winner_id; return nx;
}
function generateBracket(tid) {
  const parts = S.participants.filter((p) => p.tournament_id === tid && p.status === 'approved').sort((a, b) => a.slot - b.slot).map((p) => p.user_id);
  if (parts.length < 2) throw bad("Setka uchun kamida 2 ta tasdiqlangan ishtirokchi kerak.");
  if (S.matches.some((m) => m.tournament_id === tid && m.winner_id && !(m.round === 1 && !m.player2_id))) throw new E(409, "Natijalar kiritilgan, setkani qayta yaratib bo'lmaydi.");
  let size = 2; while (size < parts.length) size *= 2;
  const rounds = Math.log2(size), byes = size - parts.length;
  S.matches = S.matches.filter((m) => m.tournament_id !== tid); S.brackets[tid] = { rounds };
  const mk = (round, position, p1, p2) => { const m = { id: nid(), tournament_id: tid, round, position, player1_id: p1 || null, player2_id: p2 || null, winner_id: null, room: null, room_pass: null }; S.matches.push(m); return m; };
  let i = 0; const bye = [];
  for (let pos = 1; pos <= size / 2; pos++) { const p1 = parts[i++]; const p2 = pos <= byes ? null : parts[i++]; const m = mk(1, pos, p1, p2); if (!p2) bye.push(m); }
  for (let r = 2; r <= rounds; r++) for (let pos = 1; pos <= size / 2 ** r; pos++) mk(r, pos);
  for (const m of bye) { m.winner_id = m.player1_id; advance(m); }
  return { rounds, players: parts.length, byes };
}
function finishTournament(t, champId, runnerUp) {
  t.status = 'FINISHED'; t.champion_id = champId;
  S.results = S.results.filter((r) => r.tournament_id !== t.id);
  S.results.push({ tournament_id: t.id, user_id: champId, placement: 1 }); if (runnerUp) S.results.push({ tournament_id: t.id, user_id: runnerUp, placement: 2 });
  if (!S.userBadges.some((x) => x.user_id === champId && x.badge_id === 1)) S.userBadges.push({ user_id: champId, badge_id: 1, awarded_by: 'system', created_at: now() });
  notify(champId, 'champion');
}
function tInput(b) {
  const type = String(b.type || '').toUpperCase(); if (!TYPES.includes(type)) throw bad("O'yin turi noto'g'ri.");
  const slots = Number(b.max_slots); if (!Number.isInteger(slots) || slots < 2 || slots > 128) throw bad("Slot soni 2 dan 128 gacha bo'lishi kerak.");
  const date = String(b.date || ''), time = String(b.time || '');
  if (date && !/^\d{4}-\d{2}-\d{2}$/.test(date)) throw bad('Sana formati YYYY-MM-DD.'); if (time && !/^\d{2}:\d{2}$/.test(time)) throw bad('Vaqt formati HH:MM.');
  return { name: str(b.name, 3, 60, 'Turnir nomi'), type, map: String(b.map || '').trim().slice(0, 40), date, time, max_slots: slots, description: String(b.description || '').trim().slice(0, 500) };
}
const getMatch = (id) => { const m = S.matches.find((x) => x.id === Number(id)); if (!m) throw new E(404, 'Match topilmadi.'); return m; };
const isApproved = (tid, uid) => S.participants.some((p) => p.tournament_id === tid && p.user_id === String(uid) && p.status === 'approved');

const routes = []; const route = (method, pattern, admin, fn) => routes.push({ method, admin, fn, re: new RegExp('^' + pattern.replace(/:(\w+)/g, '(?<$1>[^/]+)') + '$') });
route('GET', '/api/me', 0, (c) => ({ ...profileOf(c.id), isAdmin: c.isAdmin, needsSetup: !getUser(c.id).pubg_id }));
route('POST', '/api/me/profile', 0, (c) => {
  const pubg = String(c.body.pubg_id == null ? '' : c.body.pubg_id); if (!/^\d{5,15}$/.test(pubg)) throw bad("PUBG ID faqat raqamlardan iborat bo'lishi kerak (5-15 raqam).");
  const nick = str(c.body.nickname, 2, 24, 'NIK');
  if (Object.values(S.users).some((u) => u.pubg_id === pubg && u.telegram_id !== c.id)) throw bad('Bu PUBG ID boshqa akkauntga ulangan.');
  const u = getUser(c.id); u.pubg_id = pubg; u.nickname = nick; return profileOf(c.id);
});
route('GET', '/api/tournaments', 0, (c) => ({ tournaments: S.tournaments.filter((t) => c.isAdmin || t.status !== 'DRAFT')
  .map((t) => ({ ...t, taken: S.participants.filter((p) => p.tournament_id === t.id).length, champion_nick: t.champion_id ? (getUser(t.champion_id) || {}).nickname : null }))
  .sort((a, b) => ({ OPEN: 0, LIVE: 1, DRAFT: 2, FINISHED: 3 }[a.status] - { OPEN: 0, LIVE: 1, DRAFT: 2, FINISHED: 3 }[b.status]) || b.created_at - a.created_at) }));
route('GET', '/api/tournaments/:id', 0, (c) => {
  const t = getT(c.params.id); if (t.status === 'DRAFT' && !c.isAdmin) throw new E(404, 'Turnir topilmadi.');
  const participants = S.participants.filter((p) => p.tournament_id === t.id).sort((a, b) => a.slot - b.slot).map((p) => { const u = getUser(p.user_id); return { id: p.id, slot: p.slot, status: p.status, telegram_id: u.telegram_id, nickname: u.nickname, pubg_id: c.isAdmin ? u.pubg_id : undefined, username: u.username, first_name: u.first_name, photo_url: u.photo_url }; });
  const br = S.brackets[t.id];
  const matches = S.matches.filter((m) => m.tournament_id === t.id).sort((a, b) => a.round - b.round || a.position - b.position).map((m) => {
    const mine = m.player1_id === c.id || m.player2_id === c.id, see = c.isAdmin || mine;
    return { id: m.id, round: m.round, position: m.position, round_name: br ? roundName(m.round, br.rounds) : '', p1: pubU(getUser(m.player1_id)) || null, p2: pubU(getUser(m.player2_id)) || null, winner_id: m.winner_id, room: see ? m.room : null, room_pass: see ? m.room_pass : null, room_set: !!(m.room || m.room_pass), mine };
  });
  const results = S.results.filter((r) => r.tournament_id === t.id).sort((a, b) => a.placement - b.placement).map((r) => { const u = getUser(r.user_id); return { placement: r.placement, telegram_id: u.telegram_id, nickname: u.nickname, photo_url: u.photo_url }; });
  const mine = participants.find((p) => p.telegram_id === c.id);
  return { tournament: t, participants, rounds: br ? br.rounds : 0, matches, results, my: mine ? { slot: mine.slot, status: mine.status } : null };
});

  const t = getT(c.params.id), me = getUser(c.id);

const cache = new Map();

  const tu = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || (qs.get('dev') ? { id: qs.get('dev'), first_name: qs.get('name') || 'Dev', username: 'dev' + qs.get('dev') } : null);

  }),
  ntest: run(async () => { await api('/api/admin/notify-test', 'POST'); toast('Test xabar yuborildi', 'ok'); }),
};
document.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (el && A[el.dataset.act]) A[el.dataset.act](el, e); });

/* PUBG ID: faqat raqam (harf, belgi, bo'sh joy, emoji kiritilmaydi) */
document.addEventListener('input', (e) => {
  if (e.target.id === 's_id') e.target.value = e.target.value.replace(/\D/g, '');
  if (e.target.id === 'q') { clearTimeout(A._d); A._d = setTimeout(doSearch, 350); }
});
async function doSearch() {
  const q = ($('#q') || {}).value || '', box = $('#res'); if (!box) return;
  if (q.trim().length < 2) { box.innerHTML = state('🔎', 'Kamida 2 ta belgi kiriting.'); return; }
  try {
    const { players } = await api('/api/players?q=' + encodeURIComponent(q.trim()), 'GET', null, 5000);
    box.innerHTML = players.length ? players.map((p) => `<div class="card" data-act="pl" data-id="${esc(p.telegram_id)}"><div class="row">${av(p)}<div class="sp"><b>${esc(p.nickname)}</b><div class="sm mu">ID: ${esc(p.pubg_id)}${p.username ? ' · @' + esc(p.username) : ''}</div></div><div class="sm">🏆${p.wins} · ${p.losses}</div></div>
      <div class="sm" style="margin-top:6px">${p.badges.map((b) => b.icon).join(' ') || '<span class="mu">nishon yo\'q</span>'}</div></div>`).join('') : state('🔎', 'O\'yinchi topilmadi.');
  } catch (err) { box.innerHTML = state('⚠️', err.message); }
}

/* ---------- Ishga tushirish (splash → Telegram user → profil) ---------- */
(async function boot() {
  const min = new Promise((r) => setTimeout(r, 1100));
  try {
    $('#spSub').textContent = 'Telegram aniqlanmoqda...';
    const u = await api('/api/me');
    $('#spSub').textContent = 'Profilga ulanmoqda...';
    me = u; await min;
  } catch (e) {
    $('#splash').innerHTML = `<div class="sp-logo">NX</div><div class="state err" style="padding:0 24px">${esc(e.message)}<div class="hint">Bu ilova Telegram bot ichidagi Mini App tugmasi orqali ochiladi.</div></div>`;
    return;
  }
  try { const tu = tg && tg.initDataUnsafe && tg.initDataUnsafe.user; if (tu && tu.allows_write_to_pm === false && tg.requestWriteAccess) tg.requestWriteAccess(); } catch (e) {}
  $('#app').hidden = false; $('#splash').classList.add('out'); setTimeout(() => $('#splash').remove(), 400);
  render();
})();
})();

</script>
